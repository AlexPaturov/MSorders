services:
  orders-container:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    build:
      context: ./
      dockerfile: Dockerfile
    image: orders-api
    container_name: orders-container
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - orders-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  orders-data:
    external: true

